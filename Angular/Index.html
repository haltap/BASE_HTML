<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Page</title>
</head>

<body>

    <header>
        <nav>
            <ul>
                <li><a href="https://google.com/">Google</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <h1 style="color: green;">Welcome to My Personal Page</h1>
    </header>

    <main>

        <h2>About Me</h2>

        <p>Hello! My name is Fernando and this is my first web page.</p>

        <h2>My Hobbies</h2>

        <p>I like programming, learning new things and creating websites.</p>

        <form>

            <label for="name">Name:</label>
            <input type="text" id="name" name="nombre">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password">

            <select id="gender" name="gender">

                <optgroup label="Gender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </optgroup>

                <optgroup label="Fruits">
                    <option value="apple">Apple</option>
                    <option value="banana">Banana</option>
                    <option value="orange">Orange</option>
                </optgroup>

            </select>

            <input type="checkbox" id="subscribe" name="subscribe">
            <label for="subscribe">Subscribe to newsletter</label>

            <input type="radio" id="option1" name="option" value="option1">
            <label for="option1">Option 1</label>

            <input type="radio" id="option2" name="option" value="option2">
            <label for="option2">Option 2</label>

            <textarea id="message" name="message" rows="4" cols="50"></textarea>
            
            <input type="number" id="num" name="num" min="1" max="10">
            <button type="submit">Submit</button>
            <label for ="dat">Date:</label>
            
            <table>
                <thead>
                    <tr>
                        <th>1</th>
                        <th>2</th>
                        <th>3</th>
                    </tr>
                </thead>
            </table>
        </form>

    </main>

    <footer>
        <p>&copy; 2026 My Personal Page</p>
    </footer>

</body>

</html>
